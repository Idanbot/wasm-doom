name: Prepare Chromium
description: Cache Chromium and install its Linux system dependencies
runs:
  using: composite
  steps:
    - name: Restore Chromium cache
      id: chromium
      uses: actions/cache@v5.0.0
      with:
        path: ~/.cache/ms-playwright
        key: chromium-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ hashFiles('package-lock.json') }}
    - name: Install Chromium system dependencies
      shell: bash
      run: npx playwright install-deps chromium
    - name: Install Chromium browser
      if: steps.chromium.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install chromium
