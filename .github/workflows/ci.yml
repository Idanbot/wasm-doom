name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          # npm 11 (Node 24). npm 10 rejects this lockfile.
          node-version: 24
          cache: npm
      - run: python3 -m pip install --disable-pip-version-check --break-system-packages -r art/enemies-v4/requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:wasm
      - run: npm run check:assets
      - run: npm run check:environment
      - run: npm run check:maps
      - run: npm run check:projectiles
      - run: npm run check:sfx
      - run: npm run check:voices
      - run: npm run build
      - run: node scripts/renderer-benchmark.mjs /tmp/perf-current.json
      - run: node scripts/check-perf.mjs art/perf-baseline.json /tmp/perf-current.json
      - run: node --experimental-strip-types --test src/components/game/data.test.ts src/game/hud-abi.test.ts src/game/save-abi.test.ts src/game/dev-run.test.ts src/game/voice-gate.test.ts src/game/sfx-director.test.ts src/lib/storage-migration.test.ts
      # Latest action commit is master (2026-09-12). The only release tag is v1 from 2022.
      # toolchain: stable installs the current stable Rust channel.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo test --manifest-path engine/Cargo.toml
        env:
          RUSTFLAGS: -D warnings
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: python3 -m pip install --disable-pip-version-check --break-system-packages -r art/enemies-v4/requirements.txt
      - run: npm ci
      - uses: actions/cache@v5.0.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --with-deps
      - run: node --test scripts/tactical-data.test.mjs scripts/boss-arena-assets.test.mjs scripts/enemy-art-v4.test.mjs scripts/boss-animation-assets.test.mjs scripts/boss-reward-art.test.mjs scripts/campaign25-assets.test.mjs scripts/sector-detail-assets.test.mjs scripts/weapon-frame-edges.test.mjs
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: npm run build:wasm
        env:
          RUSTFLAGS: -D warnings
      - run: npm run dev > dev.log 2>&1 &
      - run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/ && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/ > /dev/null
      - run: node scripts/browser-smoke.mjs http://127.0.0.1:8080/ screenshots/ci-menu.png
      - run: node scripts/combat-smoke.mjs http://127.0.0.1:8080/
      - run: node --test --test-concurrency=1 scripts/tactical.browser.mjs scripts/boss-arena.browser.mjs scripts/reward-pause.browser.mjs scripts/qa-run.browser.mjs scripts/campaign25.browser.mjs scripts/projectile-presentation.browser.mjs scripts/layouts-10-25.browser.mjs scripts/enemy-sector.browser.mjs scripts/sfx.browser.mjs
      - run: node scripts/end-screen-smoke.mjs http://127.0.0.1:8080/
      - run: PAGES_BASE=/blacksite/ npm run build:pages
      - run: |
          mkdir -p .blacksite/qa-pages-root
          ln -sfn ../../dist-pages .blacksite/qa-pages-root/blacksite
          python3 -m http.server 8082 --bind 127.0.0.1 --directory .blacksite/qa-pages-root > pages-test.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8082/blacksite/ > /dev/null && break
            sleep 1
          done
      - run: node --test --test-concurrency=1 --test-name-pattern=production scripts/qa-run.browser.mjs scripts/sfx-production.browser.mjs
        env:
          BLACKSITE_PRODUCTION_URL: http://127.0.0.1:8082/blacksite/
      - run: pkill -f "vite dev" || true
