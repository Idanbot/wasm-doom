name: Pages

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verified-run:
    # workflow_run has elevated permissions: never consume pull-request builds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      deploy: ${{ steps.verify.outputs.deploy }}
      sha: ${{ steps.verify.outputs.sha }}
      run-id: ${{ steps.verify.outputs.run-id }}
    steps:
      - name: Resolve successful CI for the current main commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          if [ "$SHA" != "$current" ]; then
            echo 'Skipping an outdated commit; only current main can deploy.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            RUN_ID=$(gh run list --repo "$REPOSITORY" --workflow ci.yml --commit "$SHA" --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -z "$RUN_ID" ]; then
              echo 'Current main has no successful push CI run. Run CI first.' >&2
              exit 1
            fi
          fi
          echo 'deploy=true' >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

  deploy:
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    needs: verified-run
    if: needs.verified-run.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verified-run.outputs.sha }}
      - name: Download the exact build tested by CI
        uses: actions/download-artifact@v8.0.2
        with:
          name: pages-shell
          path: dist-pages
          github-token: ${{ github.token }}
          run-id: ${{ needs.verified-run.outputs.run-id }}
      - name: Attach media from the tested commit
        run: cp -a public/game dist-pages/game
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist-pages
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
