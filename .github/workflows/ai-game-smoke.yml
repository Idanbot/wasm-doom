name: AI gameplay QA

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Bounded playtest length
        type: choice
        options: [smoke, short, extended, approaches, completion]
        default: extended
      approach:
        description: Policy for completion tier
        type: choice
        options: [commander, persistent, compact]
        default: commander
      repeats:
        description: Completion starting orientations
        type: choice
        options: ['1', '3', '5']
        default: '3'

permissions:
  contents: read
  actions: read

concurrency:
  group: blacksite-ai-gameplay-qa
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HF_HOME: ${{ github.workspace }}/.blacksite/huggingface
  USE_TF: '0'
  TOKENIZERS_PARALLELISM: 'false'
  BLACKSITE_AI_OUTPUT: .blacksite/ai-smoke

jobs:
  smoke:
    name: Decider CPU / ${{ inputs.tier }}
    env:
      BLACKSITE_AI_MODEL: decider
    # Standard free public-repository runner. No GPU, browser or renderer.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ai/decider-requirements.txt
      - name: Check committed simulation and harness contracts
        run: |
          node scripts/check-wasm-sync.mjs
          node --experimental-strip-types --test scripts/ai/*.test.mjs
          BLACKSITE_AI_MODEL=scripted BLACKSITE_AI_OUTPUT=.blacksite/ai-smoke/baseline node --experimental-strip-types scripts/ai/playtest.mjs
      - name: Install pinned CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0+cpu
      - name: Install pinned Decider CPU GGUF runtime
        env:
          CMAKE_ARGS: -DGGML_CUDA=OFF -DGGML_NATIVE=OFF
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: |
          python -m pip install -r scripts/ai/decider-requirements.txt
          # Only the GGUF SDK path is used; do not install GPU Triton/FLA dependencies.
          python -m pip install --no-deps decider-ai==1.8.1
      - name: Resolve immutable checkpoint cache key
        id: checkpoint
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const c = JSON.parse(readFileSync('scripts/ai/decider-config.json'));
          appendFileSync(process.env.GITHUB_OUTPUT, `key=blacksite-decider-${c.revision}-${c.file}\n`);
          JS
      - name: Cache pinned typed-decisions checkpoint
        uses: actions/cache@v5.0.0
        with:
          path: .blacksite/decider-model
          key: ${{ steps.checkpoint.outputs.key }}
      - name: Run bounded real gameplay and deterministic replay
        env:
          QA_TIER: ${{ inputs.tier }}
          QA_APPROACH: ${{ inputs.approach }}
          QA_REPEATS: ${{ inputs.repeats }}
        run: |
          if [[ "$QA_TIER" == "extended" ]]; then
            BLACKSITE_AI_TOTAL_SECONDS=1800 BLACKSITE_AI_TOTAL_DECISIONS=512 node --experimental-strip-types scripts/ai/extended.mjs
          elif [[ "$QA_TIER" == "approaches" ]]; then
            BLACKSITE_AI_APPROACHES=compact,persistent,commander BLACKSITE_AI_REPEATS=1 BLACKSITE_AI_TOTAL_SECONDS=1800 BLACKSITE_AI_TOTAL_DECISIONS=512 node --experimental-strip-types scripts/ai/experiments.mjs
          elif [[ "$QA_TIER" == "completion" ]]; then
            BLACKSITE_AI_APPROACHES="$QA_APPROACH" BLACKSITE_AI_REPEATS="$QA_REPEATS" BLACKSITE_AI_START_TURNS=0,0.35,-0.35,0.7,-0.7 BLACKSITE_AI_TOTAL_SECONDS=1800 BLACKSITE_AI_TOTAL_DECISIONS=512 node --experimental-strip-types scripts/ai/experiments.mjs
          elif [[ "$QA_TIER" == "short" ]]; then
            node --experimental-strip-types scripts/ai/playtest.mjs
          else
            node --experimental-strip-types scripts/ai/smoke.mjs
          fi
      - name: Publish readable job summary
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          summary = Path('.blacksite/ai-smoke/summary.txt')
          text = summary.read_text() if summary.exists() else 'Harness did not start; inspect setup logs.'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```text\n' + text + '\n```\n')
          PY
      - name: Preserve reports, decisions and inference diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ai-game-decider-${{ inputs.tier }}-${{ github.run_attempt }}
          path: .blacksite/ai-smoke/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
