name: AI gameplay QA

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Bounded playtest length
        type: choice
        options: [smoke, short, extended]
        default: extended
      source_run:
        description: Optional prior extended run ID; regenerate reports without inference
        type: string
        default: ''
      source_attempt:
        description: Artifact attempt when source_run is supplied
        type: string
        default: '1'

permissions:
  contents: read
  actions: read

concurrency:
  group: blacksite-ai-gameplay-qa
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HF_HOME: ${{ github.workspace }}/.blacksite/huggingface
  USE_TF: '0'
  TOKENIZERS_PARALLELISM: 'false'
  BLACKSITE_AI_OUTPUT: .blacksite/ai-smoke

jobs:
  smoke:
    if: inputs.source_run == ''
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sector: ${{ fromJSON(inputs.tier == 'extended' && '[1,2,3]' || '[0]') }}
    name: Decider CPU / ${{ inputs.tier }}${{ matrix.sector && format(' / sector {0}', matrix.sector) || '' }}
    env:
      BLACKSITE_AI_MODEL: decider
      BLACKSITE_AI_SECTOR: ${{ matrix.sector || 1 }}
    # Standard free public-repository runner. No GPU, browser or renderer.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ai/decider-requirements.txt
      - name: Check committed simulation and harness contracts
        run: |
          node scripts/check-wasm-sync.mjs
          node --experimental-strip-types --test scripts/ai/*.test.mjs
          BLACKSITE_AI_MODEL=scripted BLACKSITE_AI_OUTPUT=.blacksite/ai-smoke/baseline node --experimental-strip-types scripts/ai/playtest.mjs
      - name: Install pinned CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0+cpu
      - name: Install pinned Decider CPU GGUF runtime
        env:
          CMAKE_ARGS: -DGGML_CUDA=OFF -DGGML_NATIVE=OFF
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: |
          python -m pip install -r scripts/ai/decider-requirements.txt
          # Only the GGUF SDK path is used; do not install GPU Triton/FLA dependencies.
          python -m pip install --no-deps decider-ai==1.8.1
      - name: Resolve immutable checkpoint cache key
        id: checkpoint
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const c = JSON.parse(readFileSync('scripts/ai/decider-config.json'));
          appendFileSync(process.env.GITHUB_OUTPUT, `key=blacksite-decider-${c.revision}-${c.file}\n`);
          JS
      - name: Cache pinned typed-decisions checkpoint
        uses: actions/cache@v5.0.0
        with:
          path: .blacksite/decider-model
          key: ${{ steps.checkpoint.outputs.key }}
      - name: Run bounded real gameplay and deterministic replay
        env:
          QA_TIER: ${{ inputs.tier }}
        run: |
          if [[ "$QA_TIER" == "extended" ]]; then
            BLACKSITE_AI_TIER=extended BLACKSITE_AI_DECISIONS=256 BLACKSITE_AI_INFERENCE_SECONDS=1800 BLACKSITE_AI_FRAMES=60 node --experimental-strip-types scripts/ai/smoke.mjs
          elif [[ "$QA_TIER" == "short" ]]; then
            node --experimental-strip-types scripts/ai/playtest.mjs
          else
            node --experimental-strip-types scripts/ai/smoke.mjs
          fi
      - name: Publish readable job summary
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          summary = Path('.blacksite/ai-smoke/summary.txt')
          text = summary.read_text() if summary.exists() else 'Harness did not start; inspect setup logs.'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```text\n' + text + '\n```\n')
          PY
      - name: Preserve reports, decisions and inference diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ai-game-decider-${{ inputs.tier }}-sector-${{ matrix.sector }}-${{ github.run_attempt }}
          path: .blacksite/ai-smoke/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  comparison-report:
    name: Combined extended report
    needs: smoke
    if: always() && (inputs.tier == 'extended' || inputs.source_run != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: ai-game-decider-extended-sector-*-${{ inputs.source_run && inputs.source_attempt || github.run_attempt }}
          path: .blacksite/ai-artifacts
          run-id: ${{ inputs.source_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Aggregate confidence and gameplay metrics
        env:
          QA_MODELS: decider
          QA_SOURCE_RUN: ${{ inputs.source_run || github.run_id }}
        run: node scripts/ai/collect.mjs
      - name: Publish comparison summary
        if: always()
        run: |
          if [[ -f .blacksite/ai-comparison/summary.txt ]]; then
            { echo '```text'; cat .blacksite/ai-comparison/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ai-game-extended-comparison-${{ github.run_attempt }}
          path: .blacksite/ai-comparison
          include-hidden-files: true
          retention-days: 14
